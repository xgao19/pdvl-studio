[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdvl-studio"
version = "0.1.0"
description = "Provider-agnostic Physics Discovery & Verification Workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "sympy>=1.12,<2",
  "markdown-it-py>=3.0,<5",
  "bleach>=6.0,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
mcp = ["mcp>=1.0,<3"]

[project.scripts]
pdvl = "pdvl.cli:main"

[tool.setuptools.packages.find]
include = ["pdvl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
